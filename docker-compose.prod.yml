x-jvm-app: &jvm-app
  mem_limit: 1536m
  environment:
    JAVA_TOOL_OPTIONS: >
      -Xms512m
      -Xmx1024m
      -XX:+UseG1GC
      -XX:MaxMetaspaceSize=256m
      -XX:+ExitOnOutOfMemoryError

x-jvm-config: &jvm-config
  mem_limit: 512m
  environment:
    JAVA_TOOL_OPTIONS: >
      -Xms128m
      -Xmx384m
      -XX:+UseG1GC
      -XX:MaxMetaspaceSize=128m
      -XX:+ExitOnOutOfMemoryError

services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    mem_limit: 512m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - codejam-postgres-data:/var/lib/postgresql/data
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - codejam-redis-data:/data
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    <<: *jvm-config
    image: ghcr.io/${GHCR_OWNER}/codejam-config-server:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: git
      CONFIG_REPO_URL: ${CONFIG_REPO_URL}
      CONFIG_GIT_BRANCH: ${CONFIG_GIT_BRANCH:-main}
      GIT_USERNAME: ${GIT_USERNAME}
      GIT_PASSWORD: ${GIT_PASSWORD}
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  codejam-app:
    <<: *jvm-app
    image: ghcr.io/${GHCR_OWNER}/codejam-codejam-app:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/codejam-workspace:/tmp/codejam-workspace
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      ACCESS_TOKEN_EXPIRY_MS: ${ACCESS_TOKEN_EXPIRY_MS:-900000}
      REFRESH_TOKEN_EXPIRY_MS: ${REFRESH_TOKEN_EXPIRY_MS:-604800000}
      REFRESH_COOKIE_SECURE: "true"
      REFRESH_COOKIE_SAME_SITE: None
      CODEJAM_WORKSPACE_HOST_PATH: /tmp/codejam-workspace
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL}
      GATEWAY_CORS_ORIGINS: ${FRONTEND_URL}
    ports:
      - "8080:8080"
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  codejam-postgres-data:
  codejam-redis-data:

networks:
  codejam-network:
    driver: bridge
