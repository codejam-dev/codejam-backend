server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:codejam-local-dev-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  password:
    resetTokenExpiration: ${RESET_TOKEN_EXPIRATION:3600}
  oauth:
    success-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/callback
    failure-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/login?error=oauth_failed
  otp:
    enable-dynamic: ${OTP_ENABLE_DYNAMIC:false}
  gateway:
    cors:
      allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    rate-limit:
      max-requests: ${GATEWAY_RATE_LIMIT_MAX:5}
      window-duration-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
  executor:
    docker-host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    timeout-seconds: 30
    memory-limit-mb: 256
    cpu-limit: 0.5
    workspace-host-path: ${CODEJAM_WORKSPACE_HOST_PATH:}
  run-history:
    max-runs-per-user: ${RUN_HISTORY_MAX_RUNS:10}
    max-code-length: ${RUN_HISTORY_MAX_CODE_LENGTH:10000}
    max-output-length: ${RUN_HISTORY_MAX_OUTPUT_LENGTH:5000}
    max-error-length: ${RUN_HISTORY_MAX_ERROR_LENGTH:2000}

spring:
  application:
    name: codejam-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codejam_db}
    username: ${SPRING_DATASOURCE_USERNAME:codejam}
    password: ${SPRING_DATASOURCE_PASSWORD:codejam123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: profile,email
            redirect-uri: "${GATEWAY_BASE_URL:http://localhost:8080}/v1/api/auth/oauth2/callback/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

email:
  provider: ${EMAIL_PROVIDER:resend}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@localhost}

actuator:
  refresh:
    token: ${ACTUATOR_REFRESH_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,refresh
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    refresh:
      enabled: true
    shutdown:
      enabled: false
    env:
      enabled: false
    configprops:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: config-server
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
