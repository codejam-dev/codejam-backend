x-jvm-common: &jvm-common
  mem_limit: 700m
  environment:
    JAVA_TOOL_OPTIONS: >
      -Xms256m
      -Xmx512m
      -XX:+UseG1GC
      -XX:MaxMetaspaceSize=128m
      -XX:+ExitOnOutOfMemoryError

services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    mem_limit: 512m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - codejam-postgres-data:/var/lib/postgresql/data
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - codejam-redis-data:/data
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    <<: *jvm-common
    image: ghcr.io/${GHCR_OWNER}/codejam-config-server:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: git
      CONFIG_REPO_URL: ${CONFIG_REPO_URL}
      CONFIG_GIT_BRANCH: main
      GIT_USERNAME: ${GIT_USERNAME}
      GIT_PASSWORD: ${GIT_PASSWORD}
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  auth-service:
    <<: *jvm-common
    image: ghcr.io/${GHCR_OWNER}/codejam-auth-service:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  execution-service:
    <<: *jvm-common
    image: ghcr.io/${GHCR_OWNER}/codejam-execution-service:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/codejam-workspace:/tmp/codejam-workspace
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
      CODEJAM_WORKSPACE_HOST_PATH: /tmp/codejam-workspace
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api-gateway:
    <<: *jvm-common
    image: ghcr.io/${GHCR_OWNER}/codejam-api-gateway:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      execution-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: auth-service
      AUTH_SERVICE_PORT: 8081
      EXECUTION_SERVICE_URL: execution-service
      EXECUTION_SERVICE_PORT: 8082
    ports:
      - "8080:8080"
    networks:
      - codejam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  codejam-postgres-data:
  codejam-redis-data:

networks:
  codejam-network:
    driver: bridge
