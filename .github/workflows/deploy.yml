name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force rebuild all services'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/codejam
  COMPOSE_PROJECT_NAME: codejam

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      commons: ${{ steps.filter.outputs.commons }}
      config-server: ${{ steps.filter.outputs.config-server }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      execution-service: ${{ steps.filter.outputs.execution-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      docker-compose: ${{ steps.filter.outputs.docker-compose }}
      any-service: ${{ steps.any.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            commons:
              - 'codejam-commons/**'
            config-server:
              - 'config-server/**'
            auth-service:
              - 'auth-service/**'
            execution-service:
              - 'execution-service/**'
            api-gateway:
              - 'api-gateway/**'
            docker-compose:
              - 'docker-compose-prod.yml'

      - name: Force rebuild override
        if: github.event.inputs.force_all == 'true'
        run: |
          echo "commons=true" >> $GITHUB_OUTPUT
          echo "config-server=true" >> $GITHUB_OUTPUT
          echo "auth-service=true" >> $GITHUB_OUTPUT
          echo "execution-service=true" >> $GITHUB_OUTPUT
          echo "api-gateway=true" >> $GITHUB_OUTPUT
          echo "docker-compose=true" >> $GITHUB_OUTPUT
        id: force

      - name: Aggregate service changes
        id: any
        run: |
          if [[ \
            "${{ steps.filter.outputs.commons }}" == "true" || \
            "${{ steps.filter.outputs.config-server }}" == "true" || \
            "${{ steps.filter.outputs.auth-service }}" == "true" || \
            "${{ steps.filter.outputs.execution-service }}" == "true" || \
            "${{ steps.filter.outputs.api-gateway }}" == "true" || \
            "${{ github.event.inputs.force_all }}" == "true" \
          ]]; then
            echo "any=true" >> $GITHUB_OUTPUT
          else
            echo "any=false" >> $GITHUB_OUTPUT
          fi

  build-services:
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: config-server
            path: config-server
            flag: config-server
          - name: auth-service
            path: auth-service
            flag: auth-service
          - name: execution-service
            path: execution-service
            flag: execution-service
          - name: api-gateway
            path: api-gateway
            flag: api-gateway

    steps:
      - name: Decide if service needs build
        id: decide
        run: |
          if [[ "${{ needs.detect-changes.outputs[matrix.flag] }}" == "true" || \
                "${{ needs.detect-changes.outputs.commons }}" == "true" || \
                "${{ github.event.inputs.force_all }}" == "true" ]]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.build == 'true'

      - uses: actions/setup-java@v4
        if: steps.decide.outputs.build == 'true'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build commons library
        if: steps.decide.outputs.build == 'true'
        working-directory: codejam-commons
        run: mvn clean install -DskipTests -q

      - name: Build service
        if: steps.decide.outputs.build == 'true'
        working-directory: ${{ matrix.path }}
        run: mvn clean package -DskipTests -q

      - uses: docker/login-action@v3
        if: steps.decide.outputs.build == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        if: steps.decide.outputs.build == 'true'
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        if: steps.decide.outputs.build == 'true'
        with:
          context: ${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [detect-changes, build-services]
    if: always() && (needs.detect-changes.outputs.any-service == 'true' || needs.detect-changes.outputs.docker-compose == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        if: needs.build-services.result == 'failure'
        run: |
          echo "Build failed, skipping deploy"
          exit 1

      - uses: actions/checkout@v4

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: docker-compose-prod.yml
          target: ~/codejam

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            export COMPOSE_PROJECT_NAME=codejam
            cd ~/codejam

            mkdir -p /tmp/codejam-workspace

            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}

            docker compose -f docker-compose-prod.yml down --remove-orphans
            docker compose -f docker-compose-prod.yml pull
            docker compose -f docker-compose-prod.yml up -d

            docker compose -f docker-compose-prod.yml ps
